name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôle du projet
        run: npm run release-preflight

      - name: Construire l'application Windows
        run: npm run dist:win

      - name: Télécharger l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Ecole-Manager-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
